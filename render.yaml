services:
  - type: web
    name: scholar-portal
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:deploy && npm run start:render
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: TEACHER_INITIAL_PASSWORD
        sync: false
      - key: TEACHER_NAME
        value: Teacher
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: learning-portal-files
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: CRON_SECRET
        generateValue: true
