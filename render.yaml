services:
  - type: web
    name: scholar-portal
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:deploy
    startCommand: npm run start:render
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: TEACHER_INITIAL_PASSWORD
        sync: false
      - key: TEACHER_NAME
        value: Teacher
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: CRON_SECRET
        generateValue: true
